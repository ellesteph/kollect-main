<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kollect Dashboard</title>

<link rel="stylesheet" href="style.css">

<script src="https://checkout.flutterwave.com/v3.js"></script>
<script type="module" src="app.js"></script>

<style>
body{
  font-family:'Inter',sans-serif;
  margin:0;
  background:#fff;
  color:#000;
}

/* NAV */
.nav{
  display:flex;
  justify-content:space-between;
  padding:20px 40px;
  border-bottom:1px solid #eee;
}

/* WALLET CARDS */
.wallets{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:20px;
  padding:30px 40px;
}

.wallet-card{
  background:#000;
  color:#fff;
  padding:20px;
  border-radius:16px;
  transition:0.3s;
}

.wallet-card:hover{
  transform:translateY(-6px);
  box-shadow:0 10px 30px rgba(0,0,0,0.15);
}

.wallet-card h4{opacity:0.7;margin:0;}
.wallet-card h2{margin-top:10px;}

/* ACTION BUTTONS */
.actions{
  display:flex;
  gap:10px;
  padding:0 40px 20px;
}

.actions button{
  flex:1;
  padding:12px;
  background:#000;
  color:#fff;
  border:none;
  border-radius:8px;
  cursor:pointer;
}

/* TABS */
.tab-bar{
  display:flex;
  gap:10px;
  padding:0 40px;
}

.tab-bar button{
  padding:10px 15px;
  border:none;
  background:#f5f5f5;
  border-radius:8px;
  cursor:pointer;
}

.tab-bar button.active{
  background:#000;
  color:#fff;
}

/* CONTENT */
.tab-content{
  display:none;
  padding:30px 40px;
  animation:fade 0.3s ease;
}

.tab-content.active{
  display:block;
}

@keyframes fade{
  from{opacity:0; transform:translateY(10px);}
  to{opacity:1; transform:translateY(0);}
}

/* INPUTS */
input,select{
  width:100%;
  padding:12px;
  margin:10px 0;
  border:1px solid #ddd;
  border-radius:8px;
}

.primary{
  background:#000;
  color:#fff;
  padding:12px;
  border:none;
  border-radius:8px;
  cursor:pointer;
}

/* POS GRID */
.pos-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:20px;
}

.pos-card{
  border:1px solid #eee;
  padding:20px;
  border-radius:12px;
}

/* TRANSACTIONS */
.transaction-item{
  display:flex;
  justify-content:space-between;
  border-bottom:1px solid #eee;
  padding:10px 0;
}
</style>

</head>
<body>

<!-- NAV -->
<div class="nav">
  <h2>Kollect</h2>
  <button class="primary" onclick="logout()">Logout</button>
</div>

<!-- WALLET CARDS -->
<div class="wallets">
  <div class="wallet-card">
    <h4>Naira Wallet</h4>
    <h2 id="balance-ngn">₦0</h2>
  </div>

  <div class="wallet-card">
    <h4>Cedis Wallet</h4>
    <h2 id="balance-ghc">GH₵0</h2>
  </div>

  <div class="wallet-card">
    <h4>RWF Wallet</h4>
    <h2 id="balance-rwf">RWF0</h2>
  </div>
</div>

<!-- QUICK ACTIONS -->
<div class="actions">
  <button onclick="switchTab(0)">Fund</button>
  <button onclick="switchTab(1)">Receive</button>
  <button onclick="switchTab(2)">POS</button>
  <button onclick="switchTab(3)">Send</button>
  <button onclick="switchTab(4)">Withdraw</button>
  <button onclick="switchTab(5)">Transactions</button>
</div>

<!-- TAB BAR -->
<div class="tab-bar">
  <button class="active">Fund</button>
  <button>Receive</button>
  <button>POS</button>
  <button>Send</button>
  <button>Withdraw</button>
  <button>Transactions</button>
</div>

<!-- FUND -->
<div class="tab-content active">
  <h3>Fund Wallet</h3>
  <select id="fundCurrency">
    <option value="NGN">Naira</option>
    <option value="GH₵">Cedis</option>
    <option value="RWF">RWF</option>
  </select>
  <input id="fundAmount" placeholder="Amount">
  <button class="primary" onclick="fundWallet()">Fund Wallet</button>
</div>

<!-- RECEIVE -->
<div class="tab-content">
  <h3>Receive Payments</h3>
  <select id="receiveCurrency">
    <option value="NGN">Naira</option>
    <option value="GH₵">Cedis</option>
    <option value="RWF">RWF</option>
  </select>
  <input id="receiveAmount" placeholder="Amount">
  <button class="primary" onclick="generatePaymentRequest()">Generate Link</button>
  <p id="receiveLink"></p>
</div>

<!-- POS -->
<div class="tab-content">
  <h3>Virtual POS</h3>
  <div class="pos-grid">

    <div class="pos-card">
      <h4>Naira</h4>
      <input id="posAmountNGN" placeholder="Amount">
      <input id="posCardNumberNGN" placeholder="Card Number">
      <input id="posCardExpiryNGN" placeholder="MM/YY">
      <input id="posCardCVCNGN" placeholder="CVC">
      <button class="primary" onclick="collectPayment('NGN')">Charge</button>
    </div>

    <div class="pos-card">
      <h4>Cedis</h4>
      <input id="posAmountGHC" placeholder="Amount">
      <input id="posCardNumberGHC" placeholder="Card Number">
      <input id="posCardExpiryGHC" placeholder="MM/YY">
      <input id="posCardCVCGHC" placeholder="CVC">
      <button class="primary" onclick="collectPayment('GH₵')">Charge</button>
    </div>

    <div class="pos-card">
      <h4>RWF</h4>
      <input id="posAmountRWF" placeholder="Amount">
      <input id="posCardNumberRWF" placeholder="Card Number">
      <input id="posCardExpiryRWF" placeholder="MM/YY">
      <input id="posCardCVCRWF" placeholder="CVC">
      <button class="primary" onclick="collectPayment('RWF')">Charge</button>
    </div>

  </div>
</div>

<!-- SEND -->
<div class="tab-content">
  <h3>Send to Kollect User</h3>
  <input id="sendEmail" placeholder="Recipient Email">
  <select id="sendCurrency">
    <option value="NGN">Naira</option>
    <option value="GH₵">Cedis</option>
    <option value="RWF">RWF</option>
  </select>
  <input id="sendAmount" placeholder="Amount">
  <button class="primary" onclick="sendMoney()">Send</button>
</div>

<!-- WITHDRAW -->
<div class="tab-content">
  <h3>Withdraw / Send to Bank</h3>
  <input id="bankName" placeholder="Bank Name">
  <input id="accountNumber" placeholder="Account Number">
  <input id="accountName" placeholder="Account Name">
  <select id="withdrawCurrency">
    <option value="NGN">Naira</option>
    <option value="GH₵">Cedis</option>
    <option value="RWF">RWF</option>
  </select>
  <input id="withdrawAmount" placeholder="Amount">
  <button class="primary" onclick="withdrawMoney()">Withdraw</button>
</div>

<!-- TRANSACTIONS -->
<div class="tab-content">
  <h3>Recent Transactions</h3>
  <div id="transaction-list"></div>
</div>

<script>
const tabs = document.querySelectorAll(".tab-bar button");
const contents = document.querySelectorAll(".tab-content");

function switchTab(index){
  tabs.forEach(t=>t.classList.remove("active"));
  contents.forEach(c=>c.classList.remove("active"));

  tabs[index].classList.add("active");
  contents[index].classList.add("active");
}
</script>

</body>
</html>
